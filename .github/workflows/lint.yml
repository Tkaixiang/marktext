name: Lint

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint || npx eslint . --cache
        continue-on-error: false

      - name: Check code formatting
        run: npx prettier --check "**/*.{js,vue,json,md,yml,yaml}"
        continue-on-error: true

      - name: Validate package.json
        run: |
          echo "Validating package.json structure..."
          node -e "require('./package.json')"
          echo "✅ package.json is valid"

      - name: Check for security issues
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ESLint code quality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prettier formatting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package.json validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Enhanced Rules Active" >> $GITHUB_STEP_SUMMARY
          echo "- Complexity limits (max 20)" >> $GITHUB_STEP_SUMMARY
          echo "- Function size limits (max 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo "- Security rules (no-eval, no-implied-eval)" >> $GITHUB_STEP_SUMMARY
          echo "- Best practices (eqeqeq, strict equality)" >> $GITHUB_STEP_SUMMARY
